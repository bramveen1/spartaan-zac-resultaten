name: Update standings

on:
  schedule:
    # Race nights are Tuesdays. Race starts 19:30 NL time (17:30 UTC summer);
    # results trickle in over the next hour. Poll hourly Tue 18:00–23:00 UTC.
    - cron: "0 18,19,20,21,22,23 * * 2"
    # Daily catch-up at 06:00 UTC (covers race-night surprises and clock drift).
    - cron: "0 6 * * *"
    # Dedicated weekly session-discovery run: Tue 23:00 GMT+1 = 22:00 UTC.
    # DST caveat: ZAC runs in summer (NL is CEST/GMT+2), so this is 00:00 Wed
    # local in summer, not 23:00 the same evening; 23:00 summer-local would be
    # "0 21 * * 2". Kept literal per GMT+1 as specified — either time lands
    # after that night's Speedhive upload, so it doesn't affect discovery.
    - cron: "0 22 * * 2"
  workflow_dispatch:
  push:
    paths:
      - "data/config/dsq.json"

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT that inherits a Repository admin's bypass on the main-branch
          # ruleset, so the cron's auto-commit can push directly to main.
          # actions/checkout persists this in the local git credential helper,
          # so the later `git push` uses it automatically.
          token: ${{ secrets.STANDINGS_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test scripts/build-standings.test.mjs scripts/discover-sessions.test.mjs

      - name: Discover new ZAC sessions
        # Only on the dedicated weekly discovery cron (or a manual run) — not
        # on every hourly/daily standings poll.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 2'
        run: node scripts/discover-sessions.mjs

      - name: Fetch CSVs and rebuild standings
        run: node scripts/fetch-and-build.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/config/sessions.json data/standings.json data/races.json data/raw
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            ts=$(date -u +'%Y-%m-%dT%H:%MZ')
            git commit -m "Update standings ($ts)"
            git push
          fi
