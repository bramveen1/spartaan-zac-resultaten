name: Update standings

on:
  schedule:
    # Race nights are Tuesdays. Race starts 19:30 NL time (17:30 UTC summer);
    # results trickle in over the next hour. Poll hourly Tue 18:00–23:00 UTC.
    - cron: "0 18,19,20,21,22,23 * * 2"
    # Daily catch-up at 06:00 UTC (covers race-night surprises and clock drift).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT that inherits a Repository admin's bypass on the main-branch
          # ruleset, so the cron's auto-commit can push directly to main.
          # actions/checkout persists this in the local git credential helper,
          # so the later `git push` uses it automatically.
          token: ${{ secrets.STANDINGS_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test scripts/build-standings.test.mjs

      - name: Fetch CSVs and rebuild standings
        run: node scripts/fetch-and-build.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/races.json data/raw
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            ts=$(date -u +'%Y-%m-%dT%H:%MZ')
            git commit -m "Update standings ($ts)"
            git push
          fi
